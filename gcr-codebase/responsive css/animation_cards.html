<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="animation_cards.css">
</head>
<body>

        <div class="card">
            <img class="sepia" src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile 2">

            <p>UI/UX Designer</p>
        </div>

        <div class="card">
            <img class="gray" src="https://randomuser.me/api/portraits/men/46.jpg" alt="Profile 3">
            <h2>David</h2>
            <p>Software Engineer</p>
        </div>

    </div>

</body>
</html>
