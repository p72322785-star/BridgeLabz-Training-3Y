<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>

    <h1>Image Filter Gallery</h1>

    <div class="gallery">

        <div class="item">
            <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
            <p>Blur Effect</p>
        </div>

        <div class="item">
            <img class="grayscale" src="https://picsum.photos/id/1016/400/300" alt="Nature">
            <p>Grayscale Effect</p>
        </div>

        <div class="item">
            <img class="sepia" src="https://picsum.photos/id/1018/400/300" alt="Forest">
            <p>Sepia Effect</p>
        </div>

        <div class="item">
            <img class="brightness" src="https://picsum.photos/id/1020/400/300" alt="River">
            <p>Brightness Effect</p>
        </div>

        <div class="item">
            <img class="contrast" src="https://picsum.photos/id/1024/400/300" alt="Animal">
            <p>Contrast Effect</p>
        </div>

        <div class="item">
            <img class="hue" src="https://picsum.photos/id/1025/400/300" alt="Dog">
            <p>Hue-Rotate Effect</p>
        </div>

    </div>

</body>
</html>
