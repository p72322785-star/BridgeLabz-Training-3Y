<!DOCTYPE html>
<html>
<head>
    <title>Secure Form</title>
</head>
<body>

    <h1>Secure Form</h1>

    <form autocomplete="off">

        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <p>
        Turning off autocomplete can improve security by preventing
        browsers from automatically storing or filling sensitive form information.
    </p>

</body>
</html>
