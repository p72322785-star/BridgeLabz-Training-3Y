<!DOCTYPE html>
<html>
<head>

    <!-- The title defines the name displayed on the browser tab. -->
    <title>Important Head Elements</title>

    <!-- The charset defines the character encoding of the webpage. -->
    <meta charset="UTF-8">

    <!-- The description provides information about the webpage. -->
    <meta name="description" content="Example webpage showing important HTML head elements.">

    <!-- The author specifies who created the webpage. -->
    <meta name="author" content="Priya">

    <!-- The base tag sets the base URL for relative links. -->
    <base href="https://example.com/">

    <!-- The link tag connects an external resource such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag is used to write CSS styles. -->
    <style>
    </style>

    <!-- The script tag is used to add JavaScript. -->
    <script>
    </script>

</head>
<body>

    <h1>Important Head Elements</h1>
    <p>This page demonstrates important elements used inside the head section.</p>

</body>
</html>
