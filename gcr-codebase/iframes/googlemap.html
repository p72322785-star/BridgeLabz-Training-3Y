<!DOCTYPE html>
<html>
<head>
    <title>My City Map</title>
</head>
<body>

    <h1>My City - Mathura</h1>

    <!-- loading="lazy" makes the map load only when it is close to being visible on the screen. -->
    <iframe
        src="https://www.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
