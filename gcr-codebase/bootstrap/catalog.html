<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="catalog.css">
</head>

<body>

    <header class="container text-center py-5">
        <h1 class="fw-bold">Tech Store</h1>
        <p class="lead">Latest gadgets at affordable prices</p>
    </header>

    <main class="container">

        <!-- row creates the Bootstrap grid -->
        <div class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card h-100">
                    <img src="https://picsum.photos/400/300?1"
                         class="card-img-top"
                         alt="Laptop">
                    <div class="card-body text-center">
                        <h5>Laptop</h5>
                        <p>₹55,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card h-100">
                    <img src="https://picsum.photos/400/300?2"
                         class="card-img-top"
                         alt="Headphones">
                    <div class="card-body text-center">
                        <h5>Headphones</h5>
                        <p>₹2,500</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card h-100">
                    <img src="https://picsum.photos/400/300?3"
                         class="card-img-top"
                         alt="Smart Watch">
                    <div class="card-body text-center">
                        <h5>Smart Watch</h5>
                        <p>₹4,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card h-100">
                    <img src="https://picsum.photos/400/300?4"
                         class="card-img-top"
                         alt="Camera">
                    <div class="card-body text-center">
                        <h5>Camera</h5>
                        <p>₹35,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
