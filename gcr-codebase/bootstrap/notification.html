<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications Dashboard</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="notification.css">
</head>

<body>

    <main class="container py-5">

        <div class="card shadow-sm">

            <div class="card-body">

                <h1 class="text-center mb-4">
                    Notifications Dashboard
                </h1>

                <!-- Success alert -->
                <div class="alert alert-success">
                    You have successfully completed your profile.
                </div>

                <!-- Info alert -->
                <div class="alert alert-info">
                    New study tips are available in your dashboard.
                </div>

                <!-- Danger alert -->
                <div class="alert alert-danger">
                    Your password will expire soon.
                </div>

                <!-- Dismissible alert -->
                <div class="alert alert-warning alert-dismissible fade show">
                    You have a new message from the support team.

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>
                </div>

                <!-- Summary well-style section -->
                <section class="summary bg-light border rounded p-4 mt-4">

                    <h2>Summary</h2>

                    <p>
                        You have 4 notifications, 2 unread messages,
                        and 1 important security warning.
                    </p>

                </section>

            </div>

        </div>

    </main>

    <!-- Bootstrap JavaScript required for dismissible alert -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
