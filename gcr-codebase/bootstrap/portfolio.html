<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="portfolio.css">
</head>

<body class="bg-light text-dark">

    <header class="container text-center mt-4">
        <h1 class="fw-bold">Priya Verma</h1>
        <p class="lead">BTech CSE Student | Web Developer</p>
    </header>

    <main class="container text-center p-5">

        <img src="https://randomuser.me/api/portraits/women/44.jpg"
             class="img-fluid rounded-circle profile-img"
             alt="Profile Image">

        <h2 class="mt-4 mb-3 fw-bold">Hello, I'm Priya</h2>

        <p>
            I am a Computer Science student interested in web development,
            cloud technologies and modern software solutions.
        </p>

        <div class="mt-4 mb-3">
            <a href="#" class="btn btn-primary me-2">Hire Me</a>
            <a href="#" class="btn btn-outline-dark">Download CV</a>
        </div>

        <section class="mt-5">
            <h3 class="fw-bold">Contact Me</h3>

            <form class="mx-auto contact-form">

                <input type="text"
                       class="form-control mb-3"
                       placeholder="Your Name">

                <input type="email"
                       class="form-control mb-3"
                       placeholder="Your Email">

                <textarea class="form-control mb-3"
                          rows="4"
                          placeholder="Your Message"></textarea>

                <button class="btn btn-success">
                    Send Message
                </button>

            </form>
        </section>

    </main>

    <footer class="text-center p-3">
        <p>© 2026 Priya Verma</p>
    </footer>

</body>
</html>
