<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Plans</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="pricing_plan.css">
</head>

<body>

    <main class="container py-5">

        <header class="text-center mb-5">
            <h1 class="fw-bold">Choose Your Plan</h1>
            <p class="lead">
                Flexible plans for every growing business
            </p>
        </header>

        <div class="row g-4">

            <!-- Basic Plan -->
            <div class="col-12 col-md-4">

                <div class="card pricing-card h-100 shadow-sm">

                    <div class="card-body text-center p-4">

                        <h2>Basic</h2>
                        <h3>₹499/month</h3>

                        <ul class="list-group my-4">
                            <li class="list-group-item">5 Projects</li>
                            <li class="list-group-item">5 GB Storage</li>
                            <li class="list-group-item">Email Support</li>
                        </ul>

                        <button class="btn btn-outline-primary">
                            Choose Plan
                        </button>

                    </div>

                </div>

            </div>

            <!-- Pro Plan -->
            <div class="col-12 col-md-4">

                <div class="card pricing-card bg-primary text-white h-100 shadow-lg">

                    <div class="card-body text-center p-4">

                        <h2>Pro</h2>
                        <h3>₹999/month</h3>

                        <ul class="list-group my-4">
                            <li class="list-group-item">Unlimited Projects</li>
                            <li class="list-group-item">50 GB Storage</li>
                            <li class="list-group-item">Priority Support</li>
                        </ul>

                        <button class="btn btn-light">
                            Choose Plan
                        </button>

                    </div>

                </div>

            </div>

            <!-- Premium Plan -->
            <div class="col-12 col-md-4">

                <div class="card pricing-card h-100 shadow-sm">

                    <div class="card-body text-center p-4">

                        <h2>Premium</h2>
                        <h3>₹1,499/month</h3>

                        <ul class="list-group my-4">
                            <li class="list-group-item">Unlimited Projects</li>
                            <li class="list-group-item">200 GB Storage</li>
                            <li class="list-group-item">24/7 Support</li>
                        </ul>

                        <button class="btn btn-outline-primary">
                            Choose Plan
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
