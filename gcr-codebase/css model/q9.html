<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <main class="form-container">
        
        <header class="form-header">
            <h2>Contact Us</h2>
            <p>Demonstrating outline styles, outline offsets, and focus states.</p>
        </header>

        <form class="styled-form" onsubmit="return false;">
            
            <!-- Input 1: Solid Outline + Outline Offset -->
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input 
                    type="text" 
                    id="full-name" 
                    class="input-solid-offset" 
                    placeholder="John Doe"
                    required>
                <small class="helper-text">Focus style: <code>solid</code> outline with <code>outline-offset: 3px</code></small>
            </div>

            <!-- Input 2: Dashed Outline -->
            <div class="form-group">
                <label for="email-address">Email Address</label>
                <input 
                    type="email" 
                    id="email-address" 
                    class="input-dashed" 
                    placeholder="john@example.com"
                    required>
                <small class="helper-text">Focus style: <code>dashed</code> outline color change</small>
            </div>

            <!-- Input 3: Double Outline + Negative/Close Offset -->
            <div class="form-group">
                <label for="subject">Subject</label>
                <input 
                    type="text" 
                    id="subject" 
                    class="input-double" 
                    placeholder="General Inquiry">
                <small class="helper-text">Focus style: <code>double</code> 4px outline</small>
            </div>

            <!-- Textarea: Custom Offset Glow -->
            <div class="form-group">
                <label for="message">Message</label>
                <textarea 
                    id="message" 
                    rows="4" 
                    class="textarea-glow" 
                    placeholder="Type your message here..."></textarea>
                <small class="helper-text">Focus style: <code>solid</code> outline with custom vibrant color focus</small>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Send Message</button>

        </form>

    </main>

</body>
</html>
