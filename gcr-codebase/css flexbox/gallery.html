<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Product Card */
        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;

            /* Equal height */
            min-height: 180px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: 0.3s;
        }

        /* Hover Effect */
        .card:hover {
            transform: scale(1.05);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        /* Tablet - 2 Columns */
        @media (max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile - 1 Column */
        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="product-grid">

        <div class="card">
            <h2>Laptop</h2>
            <p class="price">₹55,000</p>
        </div>

        <div class="card">
            <h2>Smartphone</h2>
            <p class="price">₹25,000</p>
        </div>

        <div class="card">
            <h2>Headphones</h2>
            <p class="price">₹2,500</p>
        </div>

        <div class="card">
            <h2>Smart Watch</h2>
            <p class="price">₹4,000</p>
        </div>

        <div class="card">
            <h2>Keyboard</h2>
            <p class="price">₹1,500</p>
        </div>

        <div class="card">
            <h2>Mouse</h2>
            <p class="price">₹800</p>
        </div>

        <div class="card">
            <h2>Tablet</h2>
            <p class="price">₹18,000</p>
        </div>

        <div class="card">
            <h2>Bluetooth Speaker</h2>
            <p class="price">₹3,000</p>
        </div>

    </div>

</body>
</html>
