<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* Dashboard Grid */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 80px 1fr;
            grid-gap: 20px;
            min-height: 100vh;
            padding: 20px;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            background-color: #333;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 10px;
        }

        /* Sidebar */
        aside {
            background-color: #eeeeee;
            padding: 25px;
            border-radius: 10px;
        }

        aside h2 {
            margin-bottom: 20px;
        }

        aside nav {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        aside a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
        }

        /* Main Content */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            grid-gap: 20px;
        }

        /* Boxes */
        .box {
            background-color: #f5f5f5;
            border: 2px solid #333;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 24px;
            font-weight: bold;

            transition: 0.3s;
        }

        /* First box spans two columns */
        .box:first-child {
            grid-column: span 2;
        }

        /* Hover Effect */
        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Responsive */
        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            header {
                grid-column: 1;
            }

            main {
                grid-template-columns: 1fr;
            }

            .box:first-child {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Header -->
        <header>
            <h1>My Dashboard</h1>
        </header>

        <!-- Sidebar -->
        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main>

            <div class="box">
                Overview
            </div>

            <div class="box">
                Services
            </div>

            <div class="box">
                Projects
            </div>

            <div class="box">
                Contact
            </div>

        </main>

    </div>

</body>
</html>
