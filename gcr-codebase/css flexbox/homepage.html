<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Homepage</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 25px;
            padding: 50px;
        }

        .box {
            flex: 1;
            min-height: 200px;
            background-color: #f2f2f2;
            border: 2px solid #333;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 24px;
            font-weight: bold;

            transition: 0.3s;
        }

        /* Hover Effect */
        .box:hover {
            transform: rotate(2deg);
        }

        /* Footer */
        footer {
            width: 100%;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            main {
                flex-direction: column;
                padding: 30px;
            }

            .box {
                width: 100%;
                min-height: 150px;
            }

            nav {
                flex-wrap: wrap;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Main -->
    <main>

        <div class="box">
            Services
        </div>

        <div class="box">
            Projects
        </div>

        <div class="box">
            Contact
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
