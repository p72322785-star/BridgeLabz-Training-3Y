<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }

        /* Card Container */
        .card-container {
            width: 300px;
            height: 400px;
            perspective: 1000px;
        }

        /* Card */
        .card {
            width: 100%;
            height: 100%;
            position: relative;

            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        /* Flip Card on Hover */
        .card-container:hover .card {
            transform: rotateY(180deg);
        }

        /* Front and Back */
        .front,
        .back {
            width: 100%;
            height: 100%;
            position: absolute;

            backface-visibility: hidden;
            border-radius: 15px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 20px;
            text-align: center;
        }

        /* Front Side */
        .front {
            background-color: white;
        }

        .front img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .front h2 {
            font-size: 25px;
        }

        /* Back Side */
        .back {
            background-color: #333;
            color: white;

            transform: rotateY(180deg);
        }

        .back h2 {
            margin-bottom: 20px;
        }

        .back p {
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card-container">

        <div class="card">

            <!-- Front Side -->
            <div class="front">
                <img src="https://picsum.photos/200" alt="Sample Image">
                <h2>Web Development</h2>
            </div>

            <!-- Back Side -->
            <div class="back">
                <h2>About</h2>
                <p>
                    Web development involves creating websites and
                    web applications using HTML, CSS and JavaScript.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
