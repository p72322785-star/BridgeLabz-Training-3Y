<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #333;
            color: white;
        }

        header h1 {
            font-size: 28px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 50px;
        }

        .about {
            flex: 1;
            max-width: 500px;
        }

        .about h2 {
            margin-bottom: 15px;
        }

        .image-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-section img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                flex-direction: column;
                align-items: center;
            }

            main {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Priya</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="about">
            <h2>About Me</h2>
            <p>
                Hello! I am Priya, a B.Tech CSE student interested in
                web development and programming. I enjoy learning new
                technologies and building useful projects.
            </p>
        </section>

        <section class="image-section">
            <img src="profile.jpg" alt="Profile Image">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Priya. All Rights Reserved.</p>
    </footer>

</body>
</html>
