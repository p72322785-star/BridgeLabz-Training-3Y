<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 50px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Pricing Container */
        .pricing-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            max-width: 1100px;
            margin: auto;
        }

        /* Pricing Cards */
        .card {
            flex: 1;
            max-width: 300px;
            min-height: 350px;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            text-align: center;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: transform 0.3s ease;

            /* Fade-in animation */
            animation: fadeIn 1s ease-in;
        }

        /* Middle Card */
        .card.middle {
            transform: scale(1.08);
            background-color: #dbeafe;
            border: 3px solid #2563eb;
        }

        /* Hover Effect */
        .card:hover {
            transform: translateY(-10px);
        }

        .card.middle:hover {
            transform: scale(1.08) translateY(-10px);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card p {
            margin-bottom: 25px;
        }

        .card button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        /* Fade-in Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 750px) {
            .pricing-container {
                flex-direction: column;
            }

            .card {
                width: 100%;
                max-width: 400px;
            }

            .card.middle {
                transform: none;
            }

            .card.middle:hover {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>

    <h1>Choose Your Plan</h1>

    <div class="pricing-container">

        <!-- Basic Plan -->
        <div class="card">
            <h2>Basic</h2>
            <div class="price">₹299</div>
            <p>Basic features for personal use.</p>
            <button>Choose Plan</button>
        </div>

        <!-- Premium Plan -->
        <div class="card middle">
            <h2>Premium</h2>
            <div class="price">₹599</div>
            <p>Advanced features for growing users.</p>
            <button>Choose Plan</button>
        </div>

        <!-- Pro Plan -->
        <div class="card">
            <h2>Pro</h2>
            <div class="price">₹999</div>
            <p>All features for professional users.</p>
            <button>Choose Plan</button>
        </div>

    </div>

</body>
</html>
