<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Gallery</title>
  <link rel="stylesheet" href="q3.css">
</head>
<body>

  <header>
    <h1>Image Showcase Gallery</h1>
    <p>Hover over any image to reveal the scale effect and dark overlay.</p>
  </header>

  <!-- Responsive Image Grid Container -->
  <main class="gallery-grid">

    <!-- Card 1 -->
    <figure class="gallery-card">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/1015/600/400" alt="Mountain valley lake">
        <div class="overlay"></div>
      </div>
      <figcaption>Mountain River Valley</figcaption>
    </figure>

    <!-- Card 2 -->
    <figure class="gallery-card">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/1018/600/400" alt="Misty mountains">
        <div class="overlay"></div>
      </div>
      <figcaption>Misty Mountain Peak</figcaption>
    </figure>

    <!-- Card 3 -->
    <figure class="gallery-card">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/1025/600/400" alt="Pug wrapped in a blanket">
        <div class="overlay"></div>
      </div>
      <figcaption>Cozy Wilderness Pup</figcaption>
    </figure>

    <!-- Card 4 -->
    <figure class="gallery-card">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/1039/600/400" alt="Waterfall landscape">
        <div class="overlay"></div>
      </div>
      <figcaption>Cascading Waterfall</figcaption>
    </figure>

    <!-- Card 5 -->
    <figure class="gallery-card">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/1043/600/400" alt="Ocean coast and rocks">
        <div class="overlay"></div>
      </div>
      <figcaption>Coastal Sunset Vista</figcaption>
    </figure>

    <!-- Card 6 -->
    <figure class="gallery-card">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/1050/600/400" alt="Foggy forest road">
        <div class="overlay"></div>
      </div>
      <figcaption>Enchanted Foggy Forest</figcaption>
    </figure>

  </main>

</body>
</html>
