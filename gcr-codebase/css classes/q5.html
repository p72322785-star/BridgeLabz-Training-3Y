<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="q5.css">
</head>
<body>

  <main class="container">
    <h1>Styled Button Collection</h1>
    <p class="subtitle">Demonstrating various button styles, hover, active, focus, and disabled states.</p>

    <!-- Flexbox Row for Button Alignment -->
    <div class="button-group">
      
      <!-- Primary Button -->
      <button class="btn btn-primary">Primary Button</button>

      <!-- Secondary Button -->
      <button class="btn btn-secondary">Secondary Button</button>

      <!-- Outline Button -->
      <button class="btn btn-outline">Outline Button</button>

      <!-- Disabled Button -->
      <button class="btn btn-disabled" disabled>Disabled Button</button>

    </div>
  </main>

</body>
</html>
