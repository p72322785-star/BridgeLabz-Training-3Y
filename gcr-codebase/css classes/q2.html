<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltip Demonstration</title>
  <link rel="stylesheet" href="q2.css">
</head>
<body>

  <main class="main-container">
    <h1>CSS Tooltip Demonstration</h1>
    <p class="subtitle">Hover over the items below to reveal smooth CSS-only tooltips.</p>

    <!-- Flexbox Row of Interactive Elements -->
    <div class="tooltip-wrapper">

      <!-- Item 1: Information Icon -->
      <div class="tooltip-item">
        <span class="icon">ℹ️</span>
        <span class="label">Information</span>
        <div class="tooltip">Provides extra context about this item</div>
      </div>

      <!-- Item 2: Text/Word -->
      <div class="tooltip-item">
        <span class="highlight-word">Hover Word</span>
        <div class="tooltip">Tooltips work great on inline text links!</div>
      </div>

      <!-- Item 3: Settings Icon -->
      <div class="tooltip-item">
        <span class="icon">⚙️</span>
        <span class="label">Settings</span>
        <div class="tooltip">Configure your site preferences</div>
      </div>

      <!-- Item 4: Profile Icon -->
      <div class="tooltip-item">
        <span class="icon">👤</span>
        <span class="label">Profile</span>
        <div class="tooltip">View user account details</div>
      </div>

    </div>
  </main>

</body>
</html>
