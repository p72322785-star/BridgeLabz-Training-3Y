<!DOCTYPE html>
<html>
<head>
    <title>Inline Formatting</title>
</head>
<body>

    <p>
        I am a <strong>passionate student</strong> who loves
        <em>exploring technology</em> and learning new skills.<br>
        My favorite activity is <mark>coding</mark> because it is
        <strong>creative</strong> and <em>challenging</em>.<br>
        <small>Learning something new every day!</small>
    </p>

</body>
</html>
