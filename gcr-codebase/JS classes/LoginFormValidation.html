```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form Validation</title>
</head>
<body>
    <h2>Login Form</h2>

    <!-- Input fields for username and password -->
    <form id="loginForm">
        <label>Username:</label>
        <input type="text" id="username">
        <p id="usernameError" style="color: red;"></p>

        <label>Password:</label>
        <input type="password" id="password">
        <p id="passwordError" style="color: red;"></p>

        <button type="submit">Login</button>
    </form>

    <p id="message"></p>

    <script>
        // Select the form and its input fields.
        const form = document.getElementById("loginForm");
        const username = document.getElementById("username");
        const password = document.getElementById("password");

        // Select elements that display validation messages.
        const usernameError = document.getElementById("usernameError");
        const passwordError = document.getElementById("passwordError");
        const message = document.getElementById("message");

        // Username must contain at least 5 characters.
        const usernameRegex = /^.{5,}$/;

        // Password needs uppercase, lowercase, number, special character,
        // and at least 8 characters in total.
        const passwordRegex =
            /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S{8,}$/;

        // Validate the form when the user clicks Login.
        form.addEventListener("submit", function (event) {
            // Prevent the page from refreshing.
            event.preventDefault();

            // Clear old messages.
            usernameError.textContent = "";
            passwordError.textContent = "";
            message.textContent = "";

            let isValid = true;

            // Validate the username.
            if (!usernameRegex.test(username.value)) {
                usernameError.textContent =
                    "Username must contain at least 5 characters.";
                isValid = false;
            }

            // Validate the password.
            if (!passwordRegex.test(password.value)) {
                passwordError.textContent =
                    "Password must have 8+ characters, uppercase, lowercase, number, and special character.";
                isValid = false;
            }

            // Display the result.
            if (isValid) {
                message.textContent = "Login form validated successfully!";
                message.style.color = "green";
            } else {
                message.textContent = "Please correct the errors above.";
                message.style.color = "red";
            }
        });
    </script>
</body>
</html>
```
